info:
  name: Criar Produto
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/produtos
  body:
    type: json
    data: |-
      {
          "nome": "Notebook gamer",
          "preco": 5000.00,
          "categoria": "informática"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
